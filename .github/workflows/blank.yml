
name: Windows Virtual Environment

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Iniciar ambiente Windows
        shell: pwsh
        run: |
          Write-Host "Ambiente Windows iniciado"
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion
          Write-Host "Preparando ferramentas..."

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Verificar conexão
        shell: pwsh
        run: |
          tailscale status
          Write-Host "Verificação concluída."

